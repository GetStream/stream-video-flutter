include: ../../analysis_options.yaml

formatter:
  trailing_commas: preserve
  page_width: 80

analyzer:
  errors:
    # Upstream code that isn't strictly typed (yet).
    inference_failure_on_collection_literal: ignore
    inference_failure_on_function_invocation: ignore
    inference_failure_on_function_return_type: ignore
    inference_failure_on_instance_creation: ignore
    inference_failure_on_untyped_parameter: ignore
    strict_raw_type: ignore
    # The unit tests still use the deprecated method channel mocks.
    deprecated_member_use: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
    - windows/**
    - macos/**
    - linux/**
    - elinux/**
    - example/**

linter:
  rules:
    ## Disabled rules because the upstream code doesn't respect them (yet)
    avoid_classes_with_only_static_members: false
    avoid_dynamic_calls: false
    avoid_print: false
    avoid_void_async: false
    close_sinks: false
    comment_references: false
    constant_identifier_names: false
    do_not_use_environment: false
    join_return_with_assignment: false
    one_member_abstracts: false
    only_throw_errors: false
    prefer_foreach: false
    unawaited_futures: false
    use_late_for_private_fields_and_variables: false
    use_named_constants: false
