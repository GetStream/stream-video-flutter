name: stream_webrtc_flutter
description: Flutter WebRTC plugin for iOS/Android/Destkop/Web, based on GoogleWebRTC.
version: 5.0.0
homepage: https://github.com/GetStream/webrtc-flutter
environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

resolution: workspace

dependencies:
  collection: ^1.17.0
  flutter:
    sdk: flutter
  logger: ^2.0.2+1
  meta: ^1.16.0
  path_provider: ^2.0.2
  stream_dart_webrtc: ^1.0.0
  stream_webrtc_interface: ^1.0.0
  web: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
  test: any

flutter:
  plugin:
    platforms:
      android:
        package: io.getstream.webrtc.flutter
        pluginClass: FlutterWebRTCPlugin
      ios:
        pluginClass: FlutterWebRTCPlugin
      macos:
        pluginClass: FlutterWebRTCPlugin
      windows:
        pluginClass: FlutterWebRTCPlugin
      linux:
        pluginClass: FlutterWebRTCPlugin
      elinux:
        pluginClass: FlutterWebRTCPlugin
