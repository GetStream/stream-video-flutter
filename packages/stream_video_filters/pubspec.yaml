name: stream_video_filters
description: The Official package for Stream Video, providing video filters
  feature for video calls.
version: 2.0.0-alpha
homepage: https://getstream.io/video/
repository: https://github.com/GetStream/stream-video-flutter
issue_tracker: https://github.com/GetStream/stream-video-flutter/issues

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.16.0
  plugin_platform_interface: ^2.0.2
  stream_dart_webrtc: ^1.0.0
  stream_webrtc_flutter: ^5.0.0
  web: ^1.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.0

platforms:
  android:
  ios:
  web:

flutter:
  # The browser implementation of the web filters, built by tool/web_bundle.
  # Web only, so it is not bundled into the other platforms' apps.
  assets:
    - path: web_files/
      platforms: [web]
    - path: web_files/mediapipe/wasm/
      platforms: [web]
    - path: web_files/mediapipe/models/
      platforms: [web]
  plugin:
    platforms:
      android:
        package: io.getstream.video.flutter.stream_video_filters
        pluginClass: StreamVideoFiltersPlugin
      ios:
        pluginClass: StreamVideoFiltersPlugin
