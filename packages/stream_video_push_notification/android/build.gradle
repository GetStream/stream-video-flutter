plugins {
    id "com.android.library"
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

android {
    if (project.android.hasProperty("namespace")) {
        namespace = "io.getstream.video.flutter.stream_video_push_notification"
    }

    compileSdk = flutter.compileSdkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 21
        consumerProguardFiles 'consumer-rules.pro'
    }

    dependencies {
        implementation 'androidx.core:core-ktx:1.17.0'
        implementation 'androidx.appcompat:appcompat:1.7.0'
        implementation 'de.hdodenhof:circleimageview:3.1.0'
        implementation 'com.fasterxml.jackson.core:jackson-core:2.20.0'
        implementation 'com.fasterxml.jackson.core:jackson-databind:2.20.0'
        implementation "io.coil-kt:coil:1.4.0"
        implementation 'androidx.core:core-telecom:1.0.1'
        implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

        // Unit tests run on the JUnit Platform: Vintage for the Robolectric tests, which need
        // JUnit 4's runner (every test so far), Jupiter for plain tests (none yet). The BOM
        // pins the versions the dependencies would otherwise raise transitively.
        testImplementation platform('org.junit:junit-bom:5.12.2')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testImplementation 'org.junit.vintage:junit-vintage-engine'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        testImplementation 'junit:junit:4.13.2'
        testImplementation 'org.robolectric:robolectric:4.15.1'
        testImplementation 'androidx.test:core:1.6.1'
        testImplementation 'io.mockk:mockk:1.14.5'
    }

    testOptions {
        // The notification code reads androidx resources (CallStyle's action colours), which
        // Robolectric only has with this on. The test manifest overrides the minSdk check of the
        // example app's Firebase plugins, which the merge would otherwise trip on.
        unitTests.includeAndroidResources = true
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
