  #region Call control button migration
  # CallControlOption is NOT renamed in bulk. CallControlButton and
  # CallFeatureButton take neither its per-instance colours nor its shape,
  # elevation or padding, so renaming a call site that passes any of them turns
  # working code into a compile error. Those call sites move by hand; the
  # CHANGELOG carries the mapping.
  #
  # The colour parameters below are safe to remove in bulk because they are
  # already dead: the toggle widgets stopped reading them when they moved onto
  # StreamButton, so dropping them changes nothing at runtime.

