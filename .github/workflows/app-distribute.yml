name: App Distribute CI

on:
  push:
    branches:
      - v2
  # Only stream-video releases build the prod app; the jobs skip the
  # webrtc package releases.
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      flavor:
        type: choice
        description: Build flavor
        options:
          - beta
          - prod
      build_ios:
        type: boolean
        description: iOS
        default: true
      build_macos:
        type: boolean
        description: macOS
        default: true
      build_android:
        type: boolean
        description: Android
        default: true
      build_web:
        type: boolean
        description: Web
        default: true

env:
  MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
  CREDENTIAL_FILE_CONTENT: ${{ secrets.CREDENTIAL_FILE_CONTENT }}
  APPSTORE_API_KEY: ${{ secrets.APPSTORE_API_KEY }}
  FASTLANE_APPLE_ID: ${{ secrets.FASTLANE_APPLE_ID }}
  FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 120

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  build_and_deploy_ios:
    name: Build and Distribute Dogfooding Ios
    runs-on: xcode-27
    timeout-minutes: 60
    if: ${{ github.event_name == 'push' || (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'stream-video-v')) || inputs.build_ios == true }}
    steps:
      - name: 🔑 Mint Certificates Token
        id: certs-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FLUTTER_CI_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FLUTTER_CI_BOT_PRIVATE_KEY }}
          # fastlane match only reads the certificates.
          owner: GetStream
          repositories: ios-certificates
          permission-contents: read

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Select Xcode
        uses: ./.github/actions/select-xcode
        with:
          # Xcode 27.2 RC fails to upload to TestFlight.
          xcode-version: "27.1"

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Setup FlutterFire CLI
        run: flutter pub global activate flutterfire_cli

      - name: Setup Melos
        uses: ./.github/actions/setup-melos

      - name: Prepare environment
        run: |
          mkdir -p ~/.ssh
          echo "${{ env.APPSTORE_API_KEY }}" | base64 --decode > ~/.ssh/appstore_api_key

      - name: Setup Ruby and Gems
        uses: ruby/setup-ruby@v1
        with:
          working-directory: dogfooding/ios
          bundler-cache: true

      - name: Set build flavor to Env
        run: |
          if [[ ${{ github.event_name == 'workflow_dispatch' }} == true ]]; then
            FLAVOR=${{ inputs.flavor }}
          elif [[ ${{ github.event_name == 'release' }} == true ]]; then
            FLAVOR=prod
          else
            FLAVOR=beta
          fi
          echo "FLAVOR=$FLAVOR" >> $GITHUB_ENV

      - name: Build and Distribute
        env:
          CERTS_TOKEN: ${{ steps.certs-token.outputs.token }}
        run: |
          # match clones the certificates over HTTPS with this basic-auth header.
          export MATCH_GIT_BASIC_AUTHORIZATION="$(printf 'x-access-token:%s' "$CERTS_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$MATCH_GIT_BASIC_AUTHORIZATION"
          cd dogfooding/ios
          bundle exec fastlane ios build_and_deploy flavor:${{ env.FLAVOR }}

  build_and_deploy_macos:
    name: Build and Distribute Dogfooding macOS
    runs-on: xcode-27
    timeout-minutes: 60
    if: ${{ github.event_name == 'push' || (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'stream-video-v')) || inputs.build_macos == true }}
    steps:
      - name: 🔑 Mint Certificates Token
        id: certs-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FLUTTER_CI_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FLUTTER_CI_BOT_PRIVATE_KEY }}
          # fastlane match only reads the certificates.
          owner: GetStream
          repositories: ios-certificates
          permission-contents: read

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Select Xcode
        uses: ./.github/actions/select-xcode
        with:
          # Xcode 27.2 RC fails to upload to TestFlight.
          xcode-version: "27.1"

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Setup FlutterFire CLI
        run: flutter pub global activate flutterfire_cli

      - name: Setup Melos
        uses: ./.github/actions/setup-melos

      - name: Setup Ruby and Gems
        uses: ruby/setup-ruby@v1
        with:
          working-directory: dogfooding/macos
          bundler-cache: true

      - name: Set build flavor to Env
        run: |
          if [[ ${{ github.event_name == 'workflow_dispatch' }} == true ]]; then
            FLAVOR=${{ inputs.flavor }}
          elif [[ ${{ github.event_name == 'release' }} == true ]]; then
            FLAVOR=prod
          else
            FLAVOR=beta
          fi
          echo "FLAVOR=$FLAVOR" >> $GITHUB_ENV

      - name: Build and Distribute
        env:
          CERTS_TOKEN: ${{ steps.certs-token.outputs.token }}
        run: |
          # match clones the certificates over HTTPS with this basic-auth header.
          export MATCH_GIT_BASIC_AUTHORIZATION="$(printf 'x-access-token:%s' "$CERTS_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$MATCH_GIT_BASIC_AUTHORIZATION"
          cd dogfooding/macos
          bundle exec fastlane mac build_and_deploy flavor:${{ env.FLAVOR }}

  build_and_deploy_android:
    name: Build and Distribute Dogfooding Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name == 'push' || (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'stream-video-v')) || inputs.build_android == true }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          java-version: "17"

      - name: Setup Melos
        uses: ./.github/actions/setup-melos

      - name: Prepare environment
        run: |
          echo "${{ env.CREDENTIAL_FILE_CONTENT }}" | base64 --decode | jq > dogfooding/android/google-play-service-account.json

      - name: Setup Ruby and Gems
        uses: ruby/setup-ruby@v1
        with:
          working-directory: dogfooding/android
          bundler-cache: true

      - name: Setup Keystore
        run: |
          echo ${{ secrets.KEYSTORE }} | base64 --decode > dogfooding/android/upload-keystore.jks
          echo ${{ secrets.KEYSTORE_PROPERTIES }} | base64 --decode > dogfooding/android/key.properties

      - name: Set build flavor to Env
        run: |
          if [[ ${{ github.event_name == 'workflow_dispatch' }} == true ]]; then
            echo "FLAVOR=${{ inputs.flavor }}" >> $GITHUB_ENV
          elif [[ ${{ github.event_name == 'release' }} == true ]]; then
            echo "FLAVOR=prod" >> $GITHUB_ENV
          else
            echo "FLAVOR=beta" >> $GITHUB_ENV
          fi

      - name: Build and Distribute
        run: |
          cd dogfooding/android
          bundle exec fastlane android build_and_deploy flavor:${{ env.FLAVOR }}

      - name: Upload AAB artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-${{ env.FLAVOR }}-release-aab
          path: dogfooding/build/app/outputs/bundle/${{ env.FLAVOR }}Release/app-${{ env.FLAVOR }}-release.aab
          if-no-files-found: warn
          retention-days: 14

  build_and_deploy_web:
    name: Build and Deploy Dogfooding Web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    if: ${{ github.event_name == 'push' || (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'stream-video-v')) || inputs.build_web == true }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: config git
        run: |
          git config --global user.email "$(git log --format='%ae' HEAD^!)"
          git config --global user.name "$(git log --format='%an' HEAD^!)"
          git fetch origin gh-pages:gh-pages

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Build and Deploy
        uses: bluefireteam/flutter-gh-pages@v9
        with:
          baseHref: /stream-video-flutter/
          workingDir: dogfooding
          compileToWasm: true

  # Deploys through the shared actions in stream-core-flutter, which also
  # remove pull request builds last deployed over 30 days ago.
  build_and_deploy_web_hosted:
    name: Build and Deploy Dogfooding Web (flutter.getstream.io)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event_name == 'push' || (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'stream-video-v')) || inputs.build_web == true }}
    environment:
      name: flutter-web
      url: ${{ steps.target.outputs.url }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Target
        id: target
        uses: GetStream/stream-core-flutter/.github/actions/flutter-web-target@e338514373956150868ee67d325c96efe1c758ec
        with:
          app: video
          flavor: ${{ github.event_name == 'release' && 'prod' || inputs.flavor || 'beta' }}

      - name: Build
        working-directory: dogfooding
        env:
          BUILD_ARGS: ${{ steps.target.outputs.build-args }}
        run: |
          read -ra args <<< "$BUILD_ARGS"
          flutter build web --release --wasm "${args[@]}"

      - name: Deploy
        uses: GetStream/stream-core-flutter/.github/actions/flutter-web-deploy@e338514373956150868ee67d325c96efe1c758ec
        with:
          path: ${{ steps.target.outputs.path }}
          service-account: ${{ steps.target.outputs.service-account }}
          build-dir: dogfooding/build/web
