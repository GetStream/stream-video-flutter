name: App Distribute CI

on:
  push:
    branches:
      - v2
  # Only stream-video releases build the prod app; the jobs skip the
  # webrtc package releases.
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      flavor:
        type: choice
        description: Build flavor
        options:
          - beta
          - prod
      build_ios:
        type: boolean
        description: iOS
        default: true
      build_macos:
        type: boolean
        description: macOS
        default: true
      build_android:
        type: boolean
        description: Android
        default: true
      build_web:
        type: boolean
        description: Web
        default: true

env:
  MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
  CREDENTIAL_FILE_CONTENT: ${{ secrets.CREDENTIAL_FILE_CONTENT }}
  MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
  APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
  APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
  APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
  APPSTORE_API_KEY: ${{ secrets.APPSTORE_API_KEY }}
  FASTLANE_APPLE_ID: ${{ secrets.FASTLANE_APPLE_ID }}
  FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 120

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  build_and_deploy_ios:
    name: Build and Distribute Dogfooding Ios
    runs-on: xcode-27
    timeout-minutes: 60
    if: ${{ github.event_name == 'push' || (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'stream-video-v')) || inputs.build_ios == true }}
    steps:
      - name: Install Bot SSH Key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.BOT_SSH_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Select Xcode
        uses: ./.github/actions/select-xcode
        with:
          # Xcode 27.2 RC fails to upload to TestFlight.
          xcode-version: "27.1"

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Setup FlutterFire CLI
        run: flutter pub global activate flutterfire_cli

      - name: Setup Melos
        uses: ./.github/actions/setup-melos

      - name: Prepare environment
        run: |
          echo "${{ env.APPSTORE_API_KEY }}" | base64 --decode > ~/.ssh/appstore_api_key

      - name: Setup Ruby and Gems
        uses: ruby/setup-ruby@v1
        with:
          working-directory: dogfooding/ios
          bundler-cache: true

      - name: Set build flavor to Env
        run: |
          if [[ ${{ github.event_name == 'workflow_dispatch' }} == true ]]; then
            FLAVOR=${{ inputs.flavor }}
          elif [[ ${{ github.event_name == 'release' }} == true ]]; then
            FLAVOR=prod
          else
            FLAVOR=beta
          fi
          echo "FLAVOR=$FLAVOR" >> $GITHUB_ENV

      - name: Build and Distribute
        run: |
          cd dogfooding/ios
          bundle exec fastlane ios build_and_deploy flavor:${{ env.FLAVOR }}

  build_and_deploy_macos:
    name: Build and Distribute Dogfooding macOS
    runs-on: xcode-27
    timeout-minutes: 60
    if: ${{ github.event_name == 'push' || (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'stream-video-v')) || inputs.build_macos == true }}
    steps:
      - name: Install Bot SSH Key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.BOT_SSH_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Select Xcode
        uses: ./.github/actions/select-xcode
        with:
          # Xcode 27.2 RC fails to upload to TestFlight.
          xcode-version: "27.1"

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Setup FlutterFire CLI
        run: flutter pub global activate flutterfire_cli

      - name: Setup Melos
        uses: ./.github/actions/setup-melos

      - name: Setup Ruby and Gems
        uses: ruby/setup-ruby@v1
        with:
          working-directory: dogfooding/macos
          bundler-cache: true

      - name: Set build flavor to Env
        run: |
          if [[ ${{ github.event_name == 'workflow_dispatch' }} == true ]]; then
            FLAVOR=${{ inputs.flavor }}
          elif [[ ${{ github.event_name == 'release' }} == true ]]; then
            FLAVOR=prod
          else
            FLAVOR=beta
          fi
          echo "FLAVOR=$FLAVOR" >> $GITHUB_ENV

      - name: Build and Distribute
        run: |
          cd dogfooding/macos
          bundle exec fastlane mac build_and_deploy flavor:${{ env.FLAVOR }}

  build_and_deploy_android:
    name: Build and Distribute Dogfooding Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name == 'push' || (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'stream-video-v')) || inputs.build_android == true }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          java-version: "17"

      - name: Setup Melos
        uses: ./.github/actions/setup-melos

      - name: Prepare environment
        run: |
          echo "${{ env.CREDENTIAL_FILE_CONTENT }}" | base64 --decode | jq > dogfooding/android/firebase-service-account.json

      - name: Setup Ruby and Gems
        uses: ruby/setup-ruby@v1
        with:
          working-directory: dogfooding/android
          bundler-cache: true

      - name: Setup Keystore
        run: |
          echo ${{ secrets.KEYSTORE }} | base64 --decode > dogfooding/android/upload-keystore.jks
          echo ${{ secrets.KEYSTORE_PROPERTIES }} | base64 --decode > dogfooding/android/key.properties

      - name: Set build flavor to Env
        run: |
          if [[ ${{ github.event_name == 'workflow_dispatch' }} == true ]]; then
            echo "FLAVOR=${{ inputs.flavor }}" >> $GITHUB_ENV
          elif [[ ${{ github.event_name == 'release' }} == true ]]; then
            echo "FLAVOR=prod" >> $GITHUB_ENV
          else
            echo "FLAVOR=beta" >> $GITHUB_ENV
          fi

      - name: Build and Distribute
        run: |
          cd dogfooding/android
          bundle exec fastlane android build_and_deploy flavor:${{ env.FLAVOR }}

      - name: Upload AAB artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-${{ env.FLAVOR }}-release-aab
          path: dogfooding/build/app/outputs/bundle/${{ env.FLAVOR }}Release/app-${{ env.FLAVOR }}-release.aab
          if-no-files-found: warn
          retention-days: 14

  build_and_deploy_web:
    name: Build and Deploy Dogfooding Web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    if: ${{ github.event_name == 'push' || (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'stream-video-v')) || inputs.build_web == true }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: config git
        run: |
          git config --global user.email "$(git log --format='%ae' HEAD^!)"
          git config --global user.name "$(git log --format='%an' HEAD^!)"
          git fetch origin gh-pages:gh-pages

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Build and Deploy
        uses: bluefireteam/flutter-gh-pages@v9
        with:
          baseHref: /stream-video-flutter/
          workingDir: dogfooding
          compileToWasm: true

  build_and_deploy_web_hosted:
    name: Build and Deploy Dogfooding Web (flutter.getstream.io)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: flutter-web
    permissions:
      contents: read
      id-token: write
    if: ${{ github.event_name == 'push' || (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'stream-video-v')) || inputs.build_web == true }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set build flavor to Env
        run: |
          if [[ ${{ github.event_name == 'workflow_dispatch' }} == true ]]; then
            FLAVOR=${{ inputs.flavor }}
          elif [[ ${{ github.event_name == 'release' }} == true ]]; then
            FLAVOR=prod
          else
            FLAVOR=beta
          fi
          if [[ $FLAVOR == prod ]]; then
            WEB_PATH=video
          else
            WEB_PATH=video/beta
          fi
          echo "FLAVOR=$FLAVOR" >> "$GITHUB_ENV"
          echo "WEB_PATH=$WEB_PATH" >> "$GITHUB_ENV"

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Build
        working-directory: dogfooding
        run: flutter build web --release --wasm --base-href /${{ env.WEB_PATH }}/ --dart-define=WEB_FLAVOR=${{ env.FLAVOR }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/675676272957/locations/global/workloadIdentityPools/github-actions/providers/github-flutter
          service_account: flutter-web-deployer@stream-gcp-2026-v2.iam.gserviceaccount.com

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      # The prod path holds the beta build in its beta/ folder, so the prod
      # sync leaves that folder alone.
      - name: Deploy
        run: |
          gcloud storage rsync dogfooding/build/web gs://stream-flutter-web/${{ env.WEB_PATH }} \
            --recursive --delete-unmatched-destination-objects \
            --exclude='^beta/' \
            --cache-control="public, max-age=60"
