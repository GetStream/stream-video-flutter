name: 'PR Version Labels'

# Labels every pull request with the major version it targets:
#
#   v1 - PRs targeting "main"
#   v2 - PRs targeting "v2"
#
# Kept separate from pr_review_labels.yml so it can simply be deleted once
# the v2 branch is merged into main.

on:
  pull_request_target:
    types: [opened, reopened, edited]
    branches:
      - main
      - v2

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  version_label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const BRANCH_LABELS = { main: 'v1', v2: 'v2' };

            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const number = pr.number;
            const wanted = BRANCH_LABELS[pr.base.ref];

            // "edited" also fires for title/body changes; only act on base changes.
            if (context.payload.action === 'edited' && !context.payload.changes?.base) {
              core.info('Edit did not change the base branch, nothing to do');
              return;
            }

            const current = new Set(pr.labels.map((l) => l.name));

            // Drop the version label that no longer matches the base branch.
            for (const label of Object.values(BRANCH_LABELS)) {
              if (label !== wanted && current.has(label)) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name: label });
                core.info(`Removed "${label}"`);
              }
            }

            if (!current.has(wanted)) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: [wanted] });
              core.info(`Added "${wanted}"`);
            }
