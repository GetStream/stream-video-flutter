name: update_size_badges

# Writes the latest SDK size benchmark into the README badges and commits them
# to the branch the workflow runs on. The release-pr skill runs it on the
# release branch, so the badges ship with the release:
#
#   gh workflow run update_size_badges.yml --ref release/v<version> -f base_branch=main
on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: "Branch whose benchmark the badges show: main or v2."
        required: true
        default: main

permissions:
  contents: read

jobs:
  update_size_badges:
    runs-on:
      group: github-public-ubuntu-static
    timeout-minutes: 15
    steps:
      - name: 🔑 Mint CI Bot Token
        id: ci-bot-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FLUTTER_CI_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FLUTTER_CI_BOT_PRIVATE_KEY }}

      - name: 📚 Git Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 🔑 Mint Metrics Token
        id: metrics-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FLUTTER_CI_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FLUTTER_CI_BOT_PRIVATE_KEY }}
          # The badges only read the size benchmark.
          owner: GetStream
          repositories: stream-internal-metrics
          permission-contents: read

      - name: 💎 Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: metrics/sdk_size

      - name: 📏 Update Badges
        working-directory: metrics/sdk_size
        env:
          BASE_BRANCH: ${{ inputs.base_branch }}
          # The update_readme_badges lane clones stream-internal-metrics over SSH; this rewrites the clone
          # to HTTPS with the app token.
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ steps.metrics-token.outputs.token }}@github.com/GetStream/stream-internal-metrics.insteadOf
          GIT_CONFIG_VALUE_0: git@github.com:GetStream/stream-internal-metrics
        run: bundle exec fastlane update_readme_badges

      - name: 📤 Commit Changes
        uses: GetStream/stream-core-flutter/.github/actions/bot-commit@af3b680c0a214817915a935ddbaf5bb90f5cd190
        with:
          files: README.md
          message: "chore(repo): update the SDK size badges"
          token: ${{ steps.ci-bot-token.outputs.token }}
