name: legacy_version_analyze

env:
  # Note: The versions below should be manually updated after a new stable
  # version comes out.
  flutter_version: "3.44.0"

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "packages/**"
      - ".github/workflows/legacy_version_analyze.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "packages/**"
      - ".github/workflows/legacy_version_analyze.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Does a sanity check that packages at least pass analysis on the N-1
  # versions of Flutter stable if the package claims to support that version.
  # This is to minimize accidentally making changes that break old versions
  # (which we don't commit to supporting, but don't want to actively break)
  # without updating the constraints.
  analyze_legacy_version:
    timeout-minutes: 15
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      # Anonymous checkout: the org IP allow list refuses only signed-in requests, and this job
      # makes no other GitHub call, so it runs on a free standard runner.
      - name: "Git Checkout"
        run: |
          git init -q .
          git remote add origin "https://github.com/$REPOSITORY"
          git fetch -q origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*' "$SHA"
          git checkout -q --detach "$SHA"
        env:
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}

      - name: "Install Flutter"
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.flutter_version }}

      - name: 📊 Analyze and test packages
        uses: ./.github/actions/package_analysis
