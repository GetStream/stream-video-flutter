name: update_goldens

on: workflow_dispatch

permissions:
  contents: write

jobs:
  update_goldens:
    # Keep in sync with the analyze job in stream_video_flutter_workflow.yml,
    # which compares against the goldens rendered here.
    runs-on: ubuntu-26.04
    steps:
      - name: 🔑 Mint CI Bot Token
        id: ci-bot-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FLUTTER_CI_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FLUTTER_CI_BOT_PRIVATE_KEY }}

      - name: 📚 Git Checkout
        uses: actions/checkout@v7
        with:
          # CI bot app token, so the pushed commit can re-trigger CI on the branch.
          token: ${{ steps.ci-bot-token.outputs.token }}

      - name: 🐦 Install Flutter
        uses: ./.github/actions/setup-flutter

      - name: 🛠️ Install Melos
        uses: ./.github/actions/setup-melos

      # No codegen step: `update:goldens` only runs in packages that depend on
      # alchemist, which is stream_video_flutter alone, and that package has no
      # generated sources. Everything build_runner produces elsewhere — the
      # OpenAPI models and freezed classes in stream_video — is committed.
      - name: 🖼️ Update Goldens
        run: melos run update:goldens

      - name: 📤 Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update goldens"
          file_pattern: "**/test/**/goldens/**/*.png"
          commit_user_name: "stream-flutter-ci-bot[bot]"
          commit_user_email: "357444665+stream-flutter-ci-bot[bot]@users.noreply.github.com"
