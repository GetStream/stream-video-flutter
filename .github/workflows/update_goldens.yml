name: update_goldens

on: workflow_dispatch

permissions:
  contents: write

jobs:
  update_goldens:
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7
        with:
          # Bot token so the pushed commit can re-trigger CI on the branch.
          token: ${{ secrets.BOT_GITHUB_API_TOKEN }}

      - name: 🐦 Install Flutter
        uses: ./.github/actions/setup-flutter

      - name: 🛠️ Install Melos
        uses: ./.github/actions/setup-melos

      # No codegen step: `update:goldens` only runs in packages that depend on
      # alchemist, which is stream_video_flutter alone, and that package has no
      # generated sources. Everything build_runner produces elsewhere — the
      # OpenAPI models and freezed classes in stream_video — is committed.
      - name: 🖼️ Update Goldens
        run: melos run update:goldens

      - name: 📤 Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update goldens"
          file_pattern: "**/test/**/goldens/**/*.png"
          commit_user_name: "Stream SDK Bot"
          commit_user_email: "60655709+Stream-SDK-Bot@users.noreply.github.com"
