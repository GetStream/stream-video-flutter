name: update_goldens

on: workflow_dispatch

permissions:
  contents: read

jobs:
  update_goldens:
    runs-on: ubuntu-latest
    steps:
      - name: 🔑 Mint CI Bot Token
        id: ci-bot-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FLUTTER_CI_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FLUTTER_CI_BOT_PRIVATE_KEY }}

      - name: 📚 Git Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 🐦 Install Flutter
        uses: ./.github/actions/setup-flutter

      - name: 🛠️ Install Melos
        uses: ./.github/actions/setup-melos

      - name: ⚙️ Prepare Environment
        run: melos run generate:all

      - name: 🖼️ Update Goldens
        run: melos run update:goldens

      - name: 📤 Commit Changes
        uses: GetStream/stream-core-flutter/.github/actions/bot-commit@68fdf0bf3c779f640dbb10a1ecf7945d872408f7
        with:
          files: "**/test/**/goldens/**/*.png"
          message: "chore: update goldens"
          token: ${{ steps.ci-bot-token.outputs.token }}
