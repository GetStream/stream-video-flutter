name: sdk_size

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - "packages/**"
      - "metrics/sdk_size/**"
      - "pubspec.yaml"
      - ".github/workflows/sdk_size.yml"
      - ".github/actions/sdk-size-report/**"
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  measure-android:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@v7

      - name: Install Flutter
        uses: ./.github/actions/setup-flutter
        with:
          java-version: "17"

      - name: Measure app size
        run: dart run metrics/sdk_size/tool/measure.dart --platform android

      - name: Measure pub archives
        run: dart run metrics/sdk_size/tool/measure.dart --platform pub

      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: sdk-size-results-android
          path: build/sdk_size/results/*.json

      - name: Upload size analysis
        uses: actions/upload-artifact@v7
        with:
          name: sdk-size-analysis-android
          path: build/sdk_size/results/analysis/
          retention-days: 90

  measure-ios:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 60
    runs-on: macos-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable

      - name: Install Flutter
        uses: ./.github/actions/setup-flutter

      - name: Measure app size
        run: dart run metrics/sdk_size/tool/measure.dart --platform ios

      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: sdk-size-results-ios
          path: build/sdk_size/results/*.json

      - name: Upload size analysis
        uses: actions/upload-artifact@v7
        with:
          name: sdk-size-analysis-ios
          path: build/sdk_size/results/analysis/
          retention-days: 90

  # Reports Android while iOS is still queued or building. Only on pull
  # requests: on a push, the report stores the benchmark, which has to be
  # complete. A fork gets neither the bot key nor a token that can comment.
  report-android:
    needs: measure-android
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_PR_NUM: ${{ github.event.pull_request.number }}
      BASE_BRANCH: ${{ github.base_ref || github.ref_name }}
      GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Git Checkout
        uses: actions/checkout@v7

      - name: Report sizes
        uses: ./.github/actions/sdk-size-report
        with:
          ssh-private-key: ${{ secrets.BOT_SSH_PRIVATE_KEY }}

  # Waits for report-android as well, so the complete report always replaces
  # the partial one rather than racing it.
  report:
    needs: [measure-android, measure-ios, report-android]
    if: >-
      !cancelled()
      && (github.event_name != 'pull_request'
        || github.event.pull_request.head.repo.full_name == github.repository)
      && needs.measure-android.result == 'success'
      && needs.measure-ios.result == 'success'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_PR_NUM: ${{ github.event.pull_request.number }}
      BASE_BRANCH: ${{ github.base_ref || github.ref_name }}
      GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Git Checkout
        uses: actions/checkout@v7

      - name: Report sizes
        uses: ./.github/actions/sdk-size-report
        with:
          ssh-private-key: ${{ secrets.BOT_SSH_PRIVATE_KEY }}
