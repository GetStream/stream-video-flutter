name: sdk_size

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - "packages/**"
      - "metrics/sdk_size/**"
      - "pubspec.yaml"
      - ".github/workflows/sdk_size.yml"
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  measure:
    name: measure (${{ matrix.platform }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: ios
            os: macos-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        if: matrix.platform == 'ios'
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable

      - name: Install Flutter
        uses: ./.github/actions/setup-flutter
        with:
          java-version: ${{ matrix.platform == 'android' && '17' || '' }}

      - name: Measure app size
        run: dart run metrics/sdk_size/tool/measure.dart --platform ${{ matrix.platform }}

      - name: Measure pub archives
        if: matrix.platform == 'android'
        run: dart run metrics/sdk_size/tool/measure.dart --platform pub

      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: sdk-size-results-${{ matrix.platform }}
          path: build/sdk_size/results/*.json

      - name: Upload size analysis
        uses: actions/upload-artifact@v7
        with:
          name: sdk-size-analysis-${{ matrix.platform }}
          path: build/sdk_size/results/analysis/
          retention-days: 90

  report:
    needs: measure
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_PR_NUM: ${{ github.event.pull_request.number }}
      BASE_BRANCH: ${{ github.base_ref || github.ref_name }}
      GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Git Checkout
        uses: actions/checkout@v7

      - name: Download results
        uses: actions/download-artifact@v8
        with:
          pattern: sdk-size-results-*
          path: build/sdk_size/results
          merge-multiple: true

      - name: Connect Bot
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.BOT_SSH_PRIVATE_KEY }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: metrics/sdk_size

      - name: Configure Git
        run: |
          git config --global user.name "Stream Bot"
          git config --global user.email "ci@getstream.io"

      - name: Report sizes
        working-directory: metrics/sdk_size
        run: bundle exec fastlane sdk_size
