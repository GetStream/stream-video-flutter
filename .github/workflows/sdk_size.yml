name: sdk_size

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - "packages/**"
      - "metrics/sdk_size/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/sdk_size.yml"
      - ".github/actions/sdk-size-report/**"
  push:
    branches:
      - main
      - v2
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A push stores the benchmark, so it always runs to the end.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  measure-android:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@v7

      - name: Install Flutter
        uses: ./.github/actions/setup-flutter
        with:
          java-version: "17"

      - name: Measure app size
        run: dart run metrics/sdk_size/tool/measure.dart --platform android

      - name: Measure pub archives
        run: dart run metrics/sdk_size/tool/measure.dart --platform pub

      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: sdk-size-results-android
          path: build/sdk_size/results/*.json

      - name: Upload size analysis
        uses: actions/upload-artifact@v7
        with:
          name: sdk-size-analysis-android
          path: build/sdk_size/results/analysis/
          retention-days: 90

  measure-ios:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 60
    # Pinned, so a runner image update doesn't change the iOS numbers.
    runs-on: macos-26
    steps:
      - name: Git Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: "26.6"

      - name: Install Flutter
        uses: ./.github/actions/setup-flutter

      - name: Measure app size
        run: dart run metrics/sdk_size/tool/measure.dart --platform ios

      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: sdk-size-results-ios
          path: build/sdk_size/results/*.json

      - name: Upload size analysis
        uses: actions/upload-artifact@v7
        with:
          name: sdk-size-analysis-ios
          path: build/sdk_size/results/analysis/
          retention-days: 90

  # Reports Android while iOS is still building. Pull requests from this
  # repository only; a push needs the complete report.
  report-android:
    needs: measure-android
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_PR_NUM: ${{ github.event.pull_request.number }}
      BASE_BRANCH: ${{ github.base_ref || github.ref_name }}
      GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
      # On a pull request, github.sha is the merge commit, not the pushed one.
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Git Checkout
        uses: actions/checkout@v7

      - name: Report sizes
        uses: ./.github/actions/sdk-size-report
        with:
          ssh-private-key: ${{ secrets.BOT_SSH_PRIVATE_KEY }}

  # Waits for report-android as well, so the complete report always replaces
  # the partial one rather than racing it. On a pull request, it also reports
  # a platform that failed to measure; a push only reports a complete run.
  report:
    needs: [measure-android, measure-ios, report-android]
    if: >-
      !cancelled()
      && ((github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && (needs.measure-android.result == 'success' || needs.measure-ios.result == 'success'))
        || (github.event_name != 'pull_request'
          && needs.measure-android.result == 'success'
          && needs.measure-ios.result == 'success'))
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_PR_NUM: ${{ github.event.pull_request.number }}
      BASE_BRANCH: ${{ github.base_ref || github.ref_name }}
      GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
      # On a pull request, github.sha is the merge commit, not the pushed one.
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      FAILED_PLATFORMS: >-
        ${{ needs.measure-android.result != 'success' && 'android' || '' }},${{ needs.measure-ios.result != 'success' && 'ios' || '' }}
    steps:
      - name: Git Checkout
        uses: actions/checkout@v7

      - name: Report sizes
        uses: ./.github/actions/sdk-size-report
        with:
          ssh-private-key: ${{ secrets.BOT_SSH_PRIVATE_KEY }}
