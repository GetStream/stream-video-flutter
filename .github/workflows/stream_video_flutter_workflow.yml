name: stream_video_flutter_workflow

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  push:
    branches:
      - main
      - v2

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Centralizes every gating decision for this workflow — path filter,
  # draft state, and push-vs-PR semantics. Downstream jobs only need a
  # single `if: needs.gate.outputs.should_run == 'true'`. A job skipped
  # this way reports `success` to branch protection (vs. `on.paths`
  # filtering, which hangs forever) — see
  # https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/collaborating-on-repositories-with-code-quality-features/troubleshooting-required-status-checks
  #
  # `push` events to main and v2 always run the full suite, except the native
  # unit tests, which run only when the native code they build changed.
  gate:
    runs-on:
      group: github-public-amd64
    outputs:
      should_run: ${{ github.event_name == 'push' || (steps.filter.outputs.relevant == 'true' && github.event.pull_request.draft != true) }}
      # The packages whose native unit tests run, as JSON lists. A package's
      # tests run only when its native code for that platform changed, or
      # native code its example app builds against; see "Detect Native Changes".
      android_test_packages: ${{ steps.native_tests.outputs.android }}
      ios_test_packages: ${{ steps.native_tests.outputs.ios }}
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v7

      - name: "Detect Path Changes"
        uses: dorny/paths-filter@v4
        id: filter
        with:
          token: ''
          base: ${{ github.base_ref || github.ref }}
          filters: |
            relevant:
              - 'packages/**'
              - 'dogfooding/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'analysis_options.yaml'
              - 'all_lint_rules.yaml'
              - 'tools/*.dart'
              - '.github/actions/setup-flutter/**'
              - '.github/actions/setup-melos/**'
              - '.github/actions/select-xcode/**'
              - '.github/workflows/scripts/**'
              - '.github/workflows/stream_video_flutter_workflow.yml'

      # One filter per package and platform, named <platform>_<package>, over
      # the native code its tests build: the package's own, its example app's,
      # and the native code of the packages that example also builds. An iOS
      # package is listed only when its example has RunnerTests, since each one
      # takes a macOS runner.
      - name: "Detect Native Changes"
        uses: dorny/paths-filter@v4
        id: native
        with:
          token: ''
          base: ${{ github.base_ref || github.ref }}
          filters: |
            android_stream_video_filters:
              - 'packages/stream_video_filters/android/**'
            android_stream_video_flutter:
              - 'packages/stream_video_flutter/android/**'
              - 'packages/stream_video_flutter/example/android/**'
            android_stream_video_noise_cancellation:
              - 'packages/stream_video_noise_cancellation/android/**'
              - 'packages/stream_video_noise_cancellation/example/android/**'
            android_stream_video_push_notification:
              - 'packages/stream_video_push_notification/android/**'
              - 'packages/stream_video_push_notification/example/android/**'
            ios_stream_video_noise_cancellation:
              - 'packages/stream_video_noise_cancellation/ios/**'
              - 'packages/stream_video_noise_cancellation/example/ios/**'
              - 'webrtc/stream_webrtc_flutter/ios/**'
            ios_stream_video_push_notification:
              - 'packages/stream_video_push_notification/ios/**'
              - 'packages/stream_video_push_notification/example/ios/**'
              - 'packages/stream_video_flutter/ios/**'
              - 'webrtc/stream_webrtc_flutter/ios/**'

      - name: "List Native Test Packages"
        id: native_tests
        env:
          CHANGES: ${{ steps.native.outputs.changes }}
          DRAFT: ${{ github.event.pull_request.draft == true }}
        run: |
          if [[ "$DRAFT" == "true" ]]; then
            CHANGES='[]'
          fi
          for platform in android ios; do
            packages=$(jq -c --arg prefix "${platform}_" \
              'map(select(startswith($prefix)) | ltrimstr($prefix))' <<< "$CHANGES")
            echo "$platform=$packages" >> "$GITHUB_OUTPUT"
          done

  analyze:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    timeout-minutes: 25
    # Goldens compare pixels, so this matches the image update_goldens.yml
    # renders them on.
    runs-on:
      group: github-public-amd64
    permissions:
      contents: read
      pull-requests: read
      # Codecov authenticates the coverage upload with a GitHub OIDC token.
      id-token: write
    steps:
      - name: Git Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Flutter
        uses: ./.github/actions/setup-flutter

      - name: Install Melos
        uses: ./.github/actions/setup-melos

      - name: Install Tools
        run: flutter pub global activate remove_from_coverage

      - name: Prepare environment
        run: |
          melos run generate:all

        # TODO: Treat info and warning as error once all packages solve their issues.
      - name: Dart Analyze
        run: |
          melos run analyze:error

      - name: Check formatting
        run: |
          melos run format:verify

      ## Test and coverage reporting
      - name: "Flutter Test"
        run: melos run test:all
      - name: "Collect Coverage"
        run: melos run coverage:ignore-file --no-select
      - name: "Upload Coverage"
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: packages/*/coverage/lcov.info
      - name: "Test dart fixes"
        run: melos run test:fixes
      - name: "Browser Test"
        run: melos run test:web --no-select

  # Gates cognitive complexity on the declarations a PR touches.
  #
  # PR-only: on a push there is no base ref, and the scanner would then check
  # whole files and fail on existing hotspots this gate is not meant to block.
  complexity:
    needs: gate
    if: needs.gate.outputs.should_run == 'true' && github.event_name == 'pull_request'
    timeout-minutes: 10
    runs-on:
      group: github-public-amd64
    # Posting the sticky audit comment needs write access; without it the
    # action still annotates the diff but skips the comment.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Git Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Flutter
        uses: ./.github/actions/setup-flutter

      # `targets` leaves out `stream_video/lib/open_api` and `lib/protobuf`,
      # which hold generated code the scanner does not recognise as generated.
      - name: Cognitive Complexity
        uses: kevmoo/analytica.dart/packages/cognitive_complexity@447ff3ee2f0c12b735cc4fea80532549f7df5132 # main
        with:
          targets: >-
            packages/stream_video/lib/src
            packages/stream_video/lib/debug.dart
            packages/stream_video/lib/globals.dart
            packages/stream_video/lib/stream_video.dart
            packages/stream_video_filters/lib
            packages/stream_video_flutter/lib
            packages/stream_video_noise_cancellation/lib
            packages/stream_video_push_notification/lib
            packages/stream_video_screen_sharing/lib
          diff-base: origin/${{ github.base_ref }}
          fail-threshold: 15
          fail-on-increase: true

  build:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    timeout-minutes: 30
    runs-on:
      group: github-public-amd64
    steps:
      - name: Git Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Flutter
        uses: ./.github/actions/setup-flutter
        with:
          java-version: "17"

      - name: Install Melos
        uses: ./.github/actions/setup-melos

      - name: Prepare environment
        run: |
          melos run generate:all

      - name: Build Example
        run: |
          melos run build:example:android

      # The JVM unit tests of each package whose Android code changed, through
      # its example app. webrtc/ runs its own in the webrtc workflow.
      - name: Android Unit Tests
        if: needs.gate.outputs.android_test_packages != '[]'
        env:
          PACKAGES: ${{ needs.gate.outputs.android_test_packages }}
        run: |
          for package in $(jq -r '.[]' <<< "$PACKAGES"); do
            .github/workflows/scripts/native-tests.sh android "packages/$package"
          done

  # The iOS unit tests of each package, run through its example app's
  # RunnerTests target. The example builds against the local plugin sources.
  ios-unit-tests:
    needs: gate
    if: needs.gate.outputs.ios_test_packages != '[]'
    name: iOS unit tests (${{ matrix.package }})
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.gate.outputs.ios_test_packages) }}
    timeout-minutes: 45
    runs-on: macos-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      - name: Install Flutter
        uses: ./.github/actions/setup-flutter

      - name: Install Melos
        uses: ./.github/actions/setup-melos

      - name: iOS Unit Tests
        run: .github/workflows/scripts/native-tests.sh ios "packages/${{ matrix.package }}"

  # codecov/patch is a required check, but Codecov only reports it for a
  # commit with an upload. When the gate skips the tests, an empty upload
  # makes Codecov report it as passed.
  coverage-skipped:
    needs: gate
    if: needs.gate.outputs.should_run != 'true' && github.event_name == 'pull_request' && github.event.pull_request.draft != true
    timeout-minutes: 5
    runs-on:
      group: github-public-amd64
    permissions:
      contents: read
      pull-requests: read
      # Codecov authenticates the empty upload with a GitHub OIDC token.
      id-token: write
    steps:
      - name: Git Checkout
        uses: actions/checkout@v7

      - name: Report Skipped Coverage
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          run_command: empty-upload
          force: true
          fail_ci_if_error: true

  # The one check to mark as required: it passes when every check above
  # passed or was skipped by the gate.
  sdk-verified:
    if: always()
    needs: [gate, analyze, complexity, build, coverage-skipped, ios-unit-tests]
    timeout-minutes: 5
    runs-on:
      group: github-public-amd64
    steps:
      - name: Check results
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          if [[ "$FAILED" == "true" ]]; then
            echo "A required check failed or was cancelled."
            exit 1
          fi
          echo "All checks passed or were skipped."
