name: stream_video_flutter_workflow

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  push:
    branches:
      - main
      - v2

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Decides whether the SDK checks below need to run. A push always runs them.
  changes:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      sdk: ${{ github.event_name == 'push' || steps.filter.outputs.sdk == 'true' }}
    steps:
      - name: Git Checkout
        uses: actions/checkout@v7

      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            sdk:
              - "packages/**"
              - "dogfooding/**"
              - "pubspec.yaml"
              - "pubspec.lock"
              - "analysis_options.yaml"
              - "all_lint_rules.yaml"
              - "tools/*.dart"
              - ".github/actions/setup-flutter/**"
              - ".github/actions/setup-melos/**"
              - ".github/workflows/scripts/**"
              - ".github/workflows/stream_video_flutter_workflow.yml"

  analyze:
    needs: changes
    if: needs.changes.outputs.sdk == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Flutter
        uses: ./.github/actions/setup-flutter

      - name: Install Melos
        uses: ./.github/actions/setup-melos

      - name: Install Tools
        run: flutter pub global activate remove_from_coverage

      - name: Prepare environment
        run: |
          melos run generate:all

        # TODO: Treat info and warning as error once all packages solve their issues.
      - name: Dart Analyze
        run: |
          melos run analyze:error

      - name: Check formatting
        run: |
          melos run format:verify

      ## Test and coverage reporting
      - name: "Flutter Test"
        run: melos run test:all
      - name: "Collect Coverage"
        run: melos run coverage:ignore-file --no-select
      - name: "Upload Coverage"
        uses: codecov/codecov-action@v7
        with:
          token: ${{secrets.CODECOV_TOKEN}}
          files: packages/*/coverage/lcov.info
      - name: "Test dart fixes"
        run: melos run test:fixes

  # Gates cognitive complexity on the declarations a PR touches.
  #
  # PR-only: on a push there is no base ref, and the scanner would then check
  # whole files and fail on existing hotspots this gate is not meant to block.
  complexity:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.sdk == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    # Posting the sticky audit comment needs write access; without it the
    # action still annotates the diff but skips the comment.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Git Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Flutter
        uses: ./.github/actions/setup-flutter

      # `targets` leaves out `stream_video/lib/open_api` and `lib/protobuf`,
      # which hold generated code the scanner does not recognise as generated.
      - name: Cognitive Complexity
        uses: kevmoo/analytica.dart/packages/cognitive_complexity@447ff3ee2f0c12b735cc4fea80532549f7df5132 # main
        with:
          targets: >-
            packages/stream_video/lib/src
            packages/stream_video/lib/debug.dart
            packages/stream_video/lib/globals.dart
            packages/stream_video/lib/stream_video.dart
            packages/stream_video_filters/lib
            packages/stream_video_flutter/lib
            packages/stream_video_noise_cancellation/lib
            packages/stream_video_push_notification/lib
            packages/stream_video_screen_sharing/lib
          diff-base: origin/${{ github.base_ref }}
          fail-threshold: 15
          fail-on-increase: true

  build:
    needs: changes
    if: needs.changes.outputs.sdk == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Flutter
        uses: ./.github/actions/setup-flutter
        with:
          java-version: "17"

      - name: Install Melos
        uses: ./.github/actions/setup-melos

      - name: Prepare environment
        run: |
          melos run generate:all

      - name: Build Example
        run: |
          melos run build:example:android

  # The one check to mark as required: it passes when every check above
  # passed or was skipped because nothing relevant changed.
  verified:
    name: SDK verified
    if: always()
    needs: [changes, analyze, complexity, build]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          if [[ "$FAILED" == "true" ]]; then
            echo "A required check failed or was cancelled."
            exit 1
          fi
          echo "All checks passed or were skipped."
