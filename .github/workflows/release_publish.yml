name: release_publish

on:
  push:
    tags:
      # <product>-vX.Y.Z plus any pre-release (-…) or build (+…) suffix, e.g.
      # stream-video-v2.0.0 or stream-webrtc-flutter-v4.0.1. The parse step
      # validates the rest.
      - '*-v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch: # manual re-runs against a tag ref

concurrency:
  # false: don't let a re-run cancel an in-flight publish of the same tag.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write # create the GitHub Release
      id-token: write # OIDC auth to pub.dev
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Checkout branch
        # Default GITHUB_TOKEN: this job never pushes to git (the release step
        # passes its own token), so no bot PAT sits in git config during setup.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🏷️ Parse packages and version from tag
        id: parse
        shell: bash
        run: |
          set -euo pipefail

          ref="${GITHUB_REF#refs/tags/}"
          echo "📦 Tag: $ref"

          # <product>-v<semver>, with optional pre-release (-…) and build (+…) suffixes.
          if [[ ! "$ref" =~ ^([a-z0-9-]+)-v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?)$ ]]; then
            echo "::error ::Tag '$ref' does not match '<product>-v<semver>'."
            exit 1
          fi

          product="${BASH_REMATCH[1]}"
          version="${BASH_REMATCH[2]}"

          # stream-video releases every publishable package under packages/.
          # Any other tag names one package under webrtc/, in kebab case.
          if [[ "$product" == "stream-video" ]]; then
            pubspecs="$(grep -LE '^publish_to:[[:space:]]*none' packages/*/pubspec.yaml || true)"
            changelog="packages/stream_video_flutter/CHANGELOG.md"
          else
            pkg="${product//-/_}"
            pubspecs="$(grep -rlE "^name:[[:space:]]+$pkg\$" --include=pubspec.yaml webrtc/ 2>/dev/null | head -n1 || true)"
            if [[ -z "$pubspecs" ]]; then
              echo "::error ::No package named '$pkg' found under webrtc/."
              exit 1
            fi
            changelog="$(dirname "$pubspecs")/CHANGELOG.md"
          fi

          # Guard a stray tag: every pubspec version must equal the tag version.
          packages=()
          for pubspec in $pubspecs; do
            name="$(grep -E '^name:' "$pubspec" | head -n1 | sed -E 's/^name:[[:space:]]*//')"
            pubspec_version="$(grep -E '^version:' "$pubspec" | head -n1 | sed -E 's/^version:[[:space:]]*//')"
            if [[ "$pubspec_version" != "$version" ]]; then
              echo "::error ::Tag version ($version) does not match $pubspec version ($pubspec_version)."
              exit 1
            fi
            packages+=("$name")
          done

          # Pre-release = a hyphen suffix, ignoring any build-metadata (+…) part.
          is_prerelease=$([[ "${version%%+*}" == *-* ]] && echo true || echo false)

          # Only a stable stream-video release becomes the repository's latest.
          make_latest=$([[ "$product" == "stream-video" && "$is_prerelease" == false ]] && echo true || echo false)

          {
            echo "product=$product"
            echo "version=$version"
            echo "packages=$(IFS=,; echo "${packages[*]}")"
            echo "changelog=$changelog"
            echo "prerelease=$is_prerelease"
            echo "make_latest=$make_latest"
          } >> "$GITHUB_OUTPUT"

      # Set up the Dart SDK and provision the OIDC token used for publishing.
      - name: 🎯 Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: 🐦 Install Flutter
        uses: ./.github/actions/setup-flutter

      - name: 📦 Install Melos
        uses: ./.github/actions/setup-melos

      - name: 🌵 Dry Run
        # MELOS_PACKAGES scopes lint:pub to the tagged packages.
        run: melos run lint:pub
        env:
          MELOS_PACKAGES: ${{ steps.parse.outputs.packages }}

      - name: ⏳ Wait for in-workspace dependencies
        # A dependent can reach pub.dev before its dependency is indexed (each
        # tag publishes separately), which the server rejects. Wait via the
        # per-version endpoint — fresh in CI, unlike the listing
        # `melos --published` reads.
        shell: bash
        env:
          PACKAGES: ${{ steps.parse.outputs.packages }}
        run: |
          set -euo pipefail

          # Deps from the graph, versions from list --json. Skip private deps —
          # they never publish, so waiting on one would hang until timeout — and
          # the packages this tag publishes itself.
          info="$(melos list --json 2>/dev/null)"
          graph="$(melos list --graph 2>/dev/null | awk '/^\{/{f=1} f{print} /^\}$/{f=0}')"
          tagged=",$PACKAGES,"

          deps=""
          for pkg in ${PACKAGES//,/ }; do
            for dep in $(printf '%s' "$graph" | jq -r --arg p "$pkg" '.[$p] // [] | .[]'); do
              [[ "$tagged" == *",$dep,"* || " $deps " == *" $dep "* ]] && continue
              priv="$(printf '%s' "$info" | jq -r --arg n "$dep" '.[] | select(.name==$n) | .private')"
              if [ "$priv" != "true" ]; then deps="$deps $dep"; fi
            done
          done

          [[ -z "${deps// /}" ]] && { echo "✅ No publishable in-workspace dependencies outside this tag."; exit 0; }

          for dep in $deps; do
            want="$(printf '%s' "$info" | jq -r --arg n "$dep" '.[] | select(.name==$n) | .version')"
            enc="${want//+/%2B}" # url-encode a build-metadata '+'
            echo "⏳ Waiting for $dep v$want on pub.dev…"
            deadline=$((SECONDS + 900)) # 15 minutes
            until curl -sfL --connect-timeout 10 --max-time 30 -o /dev/null "https://pub.dev/api/packages/$dep/versions/$enc"; do
              (( SECONDS < deadline )) || { echo "::error ::Timed out after 15m waiting for $dep v$want on pub.dev. Release $dep v$want first, or re-run this once it is live."; exit 1; }
              echo "  …not live yet; retrying in 15s"
              sleep 15
            done
            echo "✅ $dep v$want is live."
          done

      - name: 📢 Publish to pub.dev
        # Idempotent by pub.dev state, not `melos --no-published` (which lags in
        # CI): skip the versions already live, publish the rest and confirm they
        # landed before the release is cut.
        shell: bash
        env:
          PACKAGES: ${{ steps.parse.outputs.packages }}
          VERSION: ${{ steps.parse.outputs.version }}
        run: |
          set -euo pipefail
          enc="${VERSION//+/%2B}" # url-encode a build-metadata '+'

          pending=()
          for pkg in ${PACKAGES//,/ }; do
            if curl -sfL --connect-timeout 10 --max-time 30 -o /dev/null "https://pub.dev/api/packages/$pkg/versions/$enc"; then
              echo "✅ $pkg v$VERSION is already on pub.dev."
            else
              pending+=("$pkg")
            fi
          done

          if [[ ${#pending[@]} -eq 0 ]]; then
            echo "✅ Nothing to publish."
            exit 0
          fi

          echo "📦 Publishing ${pending[*]} v$VERSION…"
          MELOS_PACKAGES="$(IFS=,; echo "${pending[*]}")" melos run release:pub

          # Confirm they actually landed before the release is cut (guards a
          # no-op publish from producing a Release for a version that isn't on
          # pub.dev, e.g. for a package release:pub ignores).
          for pkg in "${pending[@]}"; do
            echo "⏳ Confirming $pkg v$VERSION is live…"
            deadline=$((SECONDS + 300)) # 5 minutes
            until curl -sfL --connect-timeout 10 --max-time 30 -o /dev/null "https://pub.dev/api/packages/$pkg/versions/$enc"; do
              (( SECONDS < deadline )) || { echo "::error ::$pkg v$VERSION did not appear on pub.dev after publishing."; exit 1; }
              echo "  …not live yet; retrying in 10s"
              sleep 10
            done
            echo "✅ $pkg v$VERSION is live on pub.dev."
          done

      - name: 📝 Extract CHANGELOG section
        id: notes
        shell: bash
        env:
          PACKAGES: ${{ steps.parse.outputs.packages }}
          VERSION: ${{ steps.parse.outputs.version }}
          CHANGELOG: ${{ steps.parse.outputs.changelog }}
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/release_notes.md"

          # Sections start with `## <version>` (stream-video) or
          # `[<version>] - <date>` (webrtc). Match the version token so a dated
          # heading still matches and "0.4.0" never matches "0.4.00".
          if [[ -f "$CHANGELOG" ]]; then
            awk -v ver="$VERSION" '
              /^## / { flag = ($2 == ver); next }
              /^\[[^]]+\]/ { v = $1; gsub(/[][]/, "", v); flag = (v == ver); next }
              flag && !/^-+$/
            ' "$CHANGELOG" > "$notes_file"
          fi

          # Publish is irreversible; never fail the release on a missing heading.
          if [[ ! -s "$notes_file" ]]; then
            echo "See [CHANGELOG](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/$CHANGELOG)." > "$notes_file"
          fi

          {
            echo ""
            echo "---"
            echo "Published to pub.dev:"
            for pkg in ${PACKAGES//,/ }; do
              echo "- https://pub.dev/packages/$pkg/versions/$VERSION"
            done
          } >> "$notes_file"

          echo "path=$notes_file" >> "$GITHUB_OUTPUT"

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.parse.outputs.product }} v${{ steps.parse.outputs.version }}
          body_path: ${{ steps.notes.outputs.path }}
          prerelease: ${{ steps.parse.outputs.prerelease }}
          make_latest: ${{ steps.parse.outputs.make_latest }}
          # Bot PAT, so the published release starts app-distribute.yml.
          token: ${{ secrets.BOT_GITHUB_API_TOKEN }}
