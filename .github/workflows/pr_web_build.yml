name: PR Web Build

# Deploys the dogfooding web app of a pull request labeled `build` to
# https://flutter.getstream.io/video/pr/<number>/, through the shared workflow
# in stream-core-flutter.

on:
  pull_request:
    types: [labeled, unlabeled, synchronize, reopened, closed]

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  dogfooding:
    uses: GetStream/stream-core-flutter/.github/workflows/web_deploy_pr.yml@ci/shared-web-deploy
    with:
      app: video
      working-directory: dogfooding
      flutter-version: "3.47.8"
