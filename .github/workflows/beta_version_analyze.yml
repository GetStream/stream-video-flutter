name: beta_version_analyze

on:
  schedule:
    # Runs "At 03:00 every monday"
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Does a sanity check on packages for the next beta version so we are not surprised by any breaking changes.
  analyze_beta_versions:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      # Anonymous checkout: the org IP allow list refuses only signed-in requests, and this job
      # makes no other GitHub call, so it runs on a free standard runner.
      - name: "Git Checkout"
        run: |
          git init -q .
          git remote add origin "https://github.com/$REPOSITORY"
          git fetch -q origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*' "$SHA"
          git checkout -q --detach "$SHA"
        env:
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}

      - name: "Install Flutter"
        uses: ./.github/actions/setup-flutter
        with:
          flutter-channel: beta
          flutter-version: "" # Use the latest beta.

      - name: 📊 Analyze and test packages
        uses: ./.github/actions/package_analysis

  slack:
    name: Slack Report
    runs-on:
      group: github-public-amd64
    needs: [analyze_beta_versions]
    if: failure() && github.event_name == 'schedule'
    steps:
      - uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: "<@U08BMRSM8G5> & <@U05UCQ2B0CT>: The beta build for Flutter Video failed. Please check the logs."
          job_name: "${{ github.workflow }}: ${{ github.job }}"
          fields: repo,commit,author,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_NIGHTLY_CHECKS }}