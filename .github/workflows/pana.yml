name: pana

on:
  pull_request:
    branches:
      - main
      - v2
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  stream_video:
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7
      - name: 📊 Verify Pana Score
        uses: ./.github/actions/pana
        with:
          working_directory: packages/stream_video
          # Temporarily lowered: stream_core is pinned to a git ref via
          # dependency_overrides, which tanks the pana score. Restore to 120
          # (WASM cap) once stream_core is published on pub.dev.
          min_score: 50

  stream_video_flutter:
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7
      - name: 📊 Verify Pana Score
        uses: ./.github/actions/pana
        with:
          working_directory: packages/stream_video_flutter
          # Temporarily lowered: stream_core is pinned to a git ref via
          # dependency_overrides, which tanks the pana score. Restore to 120
          # (WASM cap) once stream_core is published on pub.dev.
          #
          # Lowered further from 60 to 50: our constraints don't yet allow
          # cached_network_image 4.x and permission_handler 13.x, which costs
          # the dependency-freshness points. Restore to 60 once those
          # constraints are bumped.
          min_score: 50

  stream_video_push_notification:
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7
      - name: 📊 Verify Pana Score
        uses: ./.github/actions/pana
        with:
          working_directory: packages/stream_video_push_notification
          # Temporarily lowered: stream_core is pinned to a git ref via
          # dependency_overrides, which tanks the pana score. Restore to 130
          # once stream_core is published on pub.dev.
          #
          # Lowered further from 60 to 55: pana requires the CHANGELOG to
          # reference the current version, and the 2.0.0-alpha pre-release has
          # no entry of its own. Restore to 60 after the 2.0.0 release.
          min_score: 55

  stream_video_screen_sharing:
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7
      - name: 📊 Verify Pana Score
        uses: ./.github/actions/pana
        with:
          working_directory: packages/stream_video_screen_sharing
          # Temporarily lowered from 140 to 135: pana requires the CHANGELOG to
          # reference the current version, and the 2.0.0-alpha pre-release has
          # no entry of its own. Restore to 140 after the 2.0.0 release.
          min_score: 135

  stream_video_noise_cancellation:
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7
      - name: 📊 Verify Pana Score
        uses: ./.github/actions/pana
        with:
          working_directory: packages/stream_video_noise_cancellation
          # Temporarily lowered from 130 to 125: pana requires the CHANGELOG to
          # reference the current version, and the 2.0.0-alpha pre-release has
          # no entry of its own. Restore to 130 after the 2.0.0 release.
          min_score: 125
