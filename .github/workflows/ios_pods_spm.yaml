name: iOS Dogfooding — SPM

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  build-ios:
    name: iOS Build (Dogfooding)
    runs-on: xcode-27

    steps:
      # Anonymous checkout: the org IP allow list refuses only signed-in requests, and this job
      # makes no other GitHub call, so it runs on a free standard runner.
      - name: 🧰 Setup Checkout
        run: |
          git init -q .
          git fetch -q --depth=1 --no-tags "https://github.com/$REPOSITORY" "$SHA"
          git checkout -q FETCH_HEAD
        env:
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}

      - name: 🍎 Select Xcode
        uses: ./.github/actions/select-xcode

      - name: 🛠️ Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: 🛠️ Setup FlutterFire CLI
        run: flutter pub global activate flutterfire_cli

      - name: 📦 Deps flutter pub get
        run: flutter pub get

      - name: 📦 SPM Enable + Resolve
        working-directory: dogfooding
        run: |
          flutter config --enable-swift-package-manager
          flutter pub get

      - name: 🧱 SPM Build (no codesign)
        working-directory: dogfooding
        run: flutter build ios --no-codesign --verbose

      - name: ✅ Verify
        run: |
          echo "✅ SPM build succeeded."
