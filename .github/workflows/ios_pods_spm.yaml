name: iOS Dogfooding — SPM

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  build-ios:
    name: iOS Build (Dogfooding)
    runs-on: { group: scaleway-macos }

    steps:
      - name: 🧰 Setup Checkout
        uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: "26.3.0"

      - name: 🛠️ Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: 🛠️ Setup FlutterFire CLI
        run: flutter pub global activate flutterfire_cli

      - name: 📦 Deps flutter pub get
        run: flutter pub get

      - name: 📦 SPM Enable + Resolve
        working-directory: dogfooding
        run: |
          flutter config --enable-swift-package-manager
          flutter pub get

      - name: 🧱 SPM Build (no codesign)
        working-directory: dogfooding
        run: flutter build ios --no-codesign --verbose

      - name: ✅ Verify
        run: |
          echo "✅ SPM build succeeded."
