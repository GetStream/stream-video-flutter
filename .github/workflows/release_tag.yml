name: release_tag

on:
  push:
    branches: [main]
  workflow_dispatch: # manual recovery, e.g. if a release commit's title was edited past the gate

concurrency:
  # false: never cancel a run mid tag-push (would drop a release).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Manual dispatch, or a commit whose message starts `chore(repo): release`.
    # The tags come from the unpublished package versions, not from the message.
    if: "${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore(repo): release') }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write # push tags

    steps:
      - name: 📚 Checkout branch
        # Bot PAT: GITHUB_TOKEN tag pushes don't trigger the publish workflow.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.BOT_GITHUB_API_TOKEN }}

      - name: 🐦 Install Flutter
        uses: ./.github/actions/setup-flutter

      - name: 📦 Install Melos
        uses: ./.github/actions/setup-melos

      - name: 🏷️ Tag unpublished packages
        # The packages under packages/ share one version and one tag,
        # stream-video-vX.Y.Z. Every other package gets its own tag, named after
        # the package in kebab case, e.g. stream-webrtc-flutter-vX.Y.Z.
        #
        # Tags are pushed one per push, in dependency order, so each starts its
        # own publish run. An existing tag (e.g. a stale one on an old commit)
        # is skipped with a warning.
        #
        # dart_webrtc and webrtc_interface are skipped, as in lint:pub and
        # release:pub in the root pubspec.yaml.
        shell: bash
        run: |
          set -euo pipefail

          list="$RUNNER_TEMP/unpublished.txt"
          : > "$list"
          # shellcheck disable=SC2016 # melos expands the variables per package
          LIST="$list" melos exec -c 1 --no-published --no-private --order-dependents \
            --ignore=dart_webrtc --ignore=webrtc_interface -- \
            'echo "$MELOS_PACKAGE_NAME $MELOS_PACKAGE_VERSION $MELOS_PACKAGE_PATH" >> "$LIST"'

          tags=()
          stream_video_version=""
          while read -r name version path; do
            case "${path#"$GITHUB_WORKSPACE"/}" in
              packages/*)
                if [[ -n "$stream_video_version" ]]; then
                  if [[ "$stream_video_version" != "$version" ]]; then
                    echo "::error ::$name is at $version, but other unpublished stream-video packages are at $stream_video_version. They release together and need the same version."
                    exit 1
                  fi
                  continue
                fi
                stream_video_version="$version"
                tags+=("stream-video-v$version")
                ;;
              *)
                tags+=("${name//_/-}-v$version")
                ;;
            esac
          done < "$list"

          if [[ ${#tags[@]} -eq 0 ]]; then
            echo "✅ Every publishable package is already on pub.dev; nothing to tag."
            exit 0
          fi

          for tag in "${tags[@]}"; do
            if git tag "$tag" 2>/dev/null; then
              echo "🏷️ Pushing $tag"
              git push origin "$tag"
            else
              echo "::warning ::Skipped $tag: tag already exists (stale tag on an old commit?), not pushed."
            fi
          done
