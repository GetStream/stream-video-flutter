name: SDK Size Report
description: "Downloads the sdk_size results and reports them with the fastlane `sdk_size` lane in metrics/sdk_size."

inputs:
  metrics-token:
    description: "Token that can push to GetStream/stream-internal-metrics."
    required: true

runs:
  using: "composite"
  steps:
    - name: 📥 Download results
      uses: actions/download-artifact@v8
      with:
        pattern: sdk-size-results-*
        path: build/sdk_size/results
        merge-multiple: true

    - name: 💎 Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: "3.3"
        bundler-cache: true
        working-directory: metrics/sdk_size

    - name: 🔧 Configure Git
      shell: bash
      run: |
        git config --global user.name "Stream Bot"
        git config --global user.email "ci@getstream.io"

    - name: 📏 Report sizes
      shell: bash
      working-directory: metrics/sdk_size
      env:
        # The sdk_size lane clones and pushes stream-internal-metrics over SSH; this rewrites the clone
        # to HTTPS with the app token.
        GIT_CONFIG_COUNT: 1
        GIT_CONFIG_KEY_0: url.https://x-access-token:${{ inputs.metrics-token }}@github.com/GetStream/stream-internal-metrics.insteadOf
        GIT_CONFIG_VALUE_0: git@github.com:GetStream/stream-internal-metrics
      run: bundle exec fastlane sdk_size
