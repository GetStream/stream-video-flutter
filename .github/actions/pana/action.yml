name: Pana Workflow
description: "Runs pana and checks the score for the package"

inputs:
  min_score:
    description: "The minimum pana score required"
    required: false
    default: "120"
  pana_version:
    description: "The pana version to use"
    required: false
  runs_on:
    description: "The runner to use"
    required: false
    default: "ubuntu-latest"
  working_directory:
    description: "The working directory"
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    - name: Temporary Override Local Dependencies
      uses: mikefarah/yq@v4.53.2
      with:
        cmd: |
          yq eval '.dependencies.stream_video = {"path": "../stream_video"}' -i packages/stream_video_flutter/pubspec.yaml
          yq eval '.dependencies.stream_video = {"path": "../stream_video"}' -i packages/stream_video_push_notification/pubspec.yaml
          yq eval '.dependencies.stream_video_flutter = {"path": "../stream_video_flutter"}' -i packages/stream_video_push_notification/pubspec.yaml
          yq eval '.dependencies.stream_video = {"path": "../stream_video"}' -i packages/stream_video_noise_cancellation/pubspec.yaml
          yq eval '.dependencies.stream_video = {"path": "../stream_video"}' -i packages/stream_video_filters/pubspec.yaml
          # stream_dart_webrtc and stream_webrtc_interface are not on pub.dev
          # yet, so every package resolves the webrtc packages from webrtc/.
          yq eval '.dependencies.stream_dart_webrtc = {"path": "../../webrtc/stream_dart_webrtc"}' -i packages/stream_video/pubspec.yaml
          yq eval '.dependencies.stream_webrtc_flutter = {"path": "../../webrtc/stream_webrtc_flutter"}' -i packages/stream_video/pubspec.yaml
          yq eval '.dependencies.stream_webrtc_interface = {"path": "../../webrtc/stream_webrtc_interface"}' -i packages/stream_video/pubspec.yaml
          yq eval '.dependencies.stream_webrtc_flutter = {"path": "../../webrtc/stream_webrtc_flutter"}' -i packages/stream_video_filters/pubspec.yaml
          yq eval '.dependencies.stream_webrtc_flutter = {"path": "../../webrtc/stream_webrtc_flutter"}' -i packages/stream_video_flutter/pubspec.yaml
          yq eval '.dependencies.stream_webrtc_flutter = {"path": "../../webrtc/stream_webrtc_flutter"}' -i packages/stream_video_noise_cancellation/pubspec.yaml
          yq eval '.dependencies.stream_webrtc_flutter = {"path": "../../webrtc/stream_webrtc_flutter"}' -i packages/stream_video_push_notification/pubspec.yaml
          yq eval '.dependencies.stream_webrtc_interface = {"path": "../stream_webrtc_interface"}' -i webrtc/stream_dart_webrtc/pubspec.yaml
          yq eval '.dependencies.stream_dart_webrtc = {"path": "../stream_dart_webrtc"}' -i webrtc/stream_webrtc_flutter/pubspec.yaml
          yq eval '.dependencies.stream_webrtc_interface = {"path": "../stream_webrtc_interface"}' -i webrtc/stream_webrtc_flutter/pubspec.yaml

    - name: Install Flutter
      uses: ./.github/actions/setup-flutter

    - name: Install Pana
      working-directory: ${{ inputs.working_directory }}
      shell: bash
      run: flutter pub global activate pana ${{inputs.pana_version}}

    - name: Verify Pana Score
      working-directory: ${{ inputs.working_directory }}
      shell: bash
      run: |
        PANA=$(pana . --no-warning --project-root "${{ github.workspace }}"); PANA_SCORE=$(echo $PANA | sed -n "s/.*Points: \([0-9]*\)\/\([0-9]*\)./\1\/\2/p")
        echo "Score: $PANA_SCORE"
        IFS='/'; read -a SCORE_ARR <<< "$PANA_SCORE"; SCORE=SCORE_ARR[0];
        if (( $SCORE < ${{inputs.min_score}} )); then echo "The minimum score of ${{inputs.min_score}} was not met!"; exit 1; fi
