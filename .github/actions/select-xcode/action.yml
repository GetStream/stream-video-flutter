name: Select Xcode
description: "Selects the Xcode version used for all Apple builds in this repo."

inputs:
  xcode-version:
    description: "The Xcode version to select."
    required: false
    default: "26.3.0"

runs:
  using: "composite"
  steps:
    - name: 🍎 Select Xcode
      uses: maxim-lobanov/setup-xcode@v1.7.0
      with:
        xcode-version: ${{ inputs.xcode-version }}
