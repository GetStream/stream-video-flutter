# Paths that are not part of the SDK coverage:
# - the forked WebRTC packages under webrtc/
# - the dogfooding sample app
# - the generated protobuf code
ignore:
  - "webrtc/**"
  - "dogfooding/**"
  - "packages/stream_video/lib/protobuf/**"

# Codecov only stores the uploads. The coverage job in
# stream_video_flutter_workflow.yml reports on pull requests.
coverage:
  status:
    project: off
    patch: off
comment: false
github_checks:
  annotations: false
